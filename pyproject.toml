[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armor-native-precision"
version = "0.1.0"
description = "Native-pixel armor corner localization with heatmaps and subpixel offsets"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.26,<2", "opencv-python>=4.10,<4.11"]

[project.optional-dependencies]
proposal = ["ultralytics==8.3.0", "torchvision>=0.20"]
export = ["onnx>=1.17,<2", "onnxruntime>=1.20,<2"]

[project.scripts]
armor-train = "armor_native.train:main"
armor-infer = "armor_native.infer:main"
armor-export = "armor_native.export:main"
armor-manifest = "armor_native.data:main"

[tool.setuptools.packages.find]
where = ["src"]
